<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helix AI Support Concierge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧬</text></svg>">
</head>
<body class="dark">
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <span class="icon">🧬</span>
                <h1>Helix</h1>
            </div>
            
            <div class="session-info" id="session-info">
                <h3>Current Session</h3>
                <p id="user-id-display">User: Not set</p>
                <p id="session-id-display">ID: None</p>
                <span class="badge" id="plan-badge">Pro</span>
            </div>

            <nav class="actions">
                <button id="new-chat-btn" class="btn-secondary">
                    <span>+</span> New Session
                </button>
                <button id="sync-docs-btn" class="btn-secondary" style="margin-top: 12px;">
                    <span>🔄</span> Sync Knowledge
                </button>
                <button id="upload-doc-btn" class="btn-secondary" style="margin-top: 12px;">
                    <span>📤</span> Upload Doc (.md)
                </button>
                <input type="file" id="doc-upload-input" accept=".md" style="display: none;">
            </nav>

            <div class="trace-panel" id="trace-panel">
                <h3>Pipeline Trace</h3>
                <div id="trace-content" class="trace-content">
                    <p class="empty-msg">No active trace</p>
                </div>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-main">
            <header class="chat-header">
                <h2>Support Concierge</h2>
                <div class="status-indicator">
                    <span class="dot"></span>
                    Online
                </div>
            </header>

            <div class="messages-container" id="messages-container">
                <div class="message assistant">
                    <div class="avatar">H</div>
                    <div class="bubble">
                        Hello! I'm the Helix Support Specialist. How can I help you today?
                    </div>
                </div>
            </div>

            <footer class="chat-footer">
                <form id="chat-form">
                    <input type="text" id="user-input" placeholder="Type a message..." autocomplete="off">
                    <button type="submit" id="send-btn">
                        <svg viewBox="0 0 24 24" width="24" height="24">
                            <path fill="currentColor" d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
                        </svg>
                    </button>
                </form>
            </footer>
        </main>
    </div>

    <!-- Initialization Modal -->
    <div id="setup-modal" class="modal">
        <div class="modal-content">
            <h2>Welcome to Helix</h2>
            <p>Please enter your credentials to start chatting.</p>
            <input type="text" id="setup-user-id" placeholder="User ID (e.g. u1)" value="u1">
            <input type="password" id="setup-api-key" placeholder="Google API Key">
            <select id="setup-plan">
                <option value="pro">Pro Plan</option>
                <option value="free">Free Plan</option>
            </select>
            <button id="start-btn" class="btn-primary">Start Chatting</button>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
